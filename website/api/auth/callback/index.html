<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KYOKA 3.0 — Discord OAuth2 Callback</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body {
      background: #07030D;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .callback-card {
      max-width: 580px;
      width: 100%;
      background: rgba(18, 9, 34, 0.95);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: var(--radius-lg, 16px);
      padding: 2.5rem;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(124, 58, 237, 0.2);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(168, 85, 247, 0.25);
      border-top-color: var(--purple-light, #C084FC);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="callback-card" id="callback-card">
    <div class="spinner"></div>
    <h2 style="color: #FFFFFF; margin-bottom: 0.5rem;">Authenticating with Discord...</h2>
    <p style="color: #94A3B8; font-size: 0.95rem; line-height: 1.5;" id="callback-status">
      Validating authorization credentials with the KYOKA Sovereign Authority...
    </p>
  </div>

  <script type="module">
    import { setApiBase } from '/js/api.js';

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');
    const errorDesc = params.get('error_description');

    const card = document.getElementById('callback-card');
    const statusText = document.getElementById('callback-status');

    if (error) {
      card.innerHTML = `
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">⚠️</div>
        <h2 style="color: #EF4444; margin-bottom: 0.5rem;">Authorization Cancelled</h2>
        <p style="color: #94A3B8; margin-bottom: 1.5rem;">${errorDesc || error}</p>
        <a href="/dashboard" class="btn btn-primary">Return to Dashboard</a>
      `;
    } else if (code) {
      statusText.textContent = 'Authorization code received. Connecting to server session...';
      // Forward to dashboard with code for local handling
      sessionStorage.setItem('kyoka_oauth_code', code);
      setTimeout(() => {
        window.location.href = `/dashboard?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state || '')}`;
      }, 600);
    } else {
      window.location.href = '/dashboard';
    }
  </script>
</body>
</html>
