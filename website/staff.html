<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KYOKA 3.0 — Staff Dashboard & Operations Center</title>
  <meta name="description" content="Authorized staff dashboard for KYOKA 3.0. Review open tickets, manage website staff permissions, and monitor sync queues." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="stylesheet" href="/css/style.css?v=3.6.0" />
  <link rel="stylesheet" href="/css/dashboard.css?v=3.6.0" />
  <style>
    .staff-container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      width: 100%;
    }
    .staff-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(12px);
    }
    .staff-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    .staff-table th, .staff-table td {
      padding: 0.85rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border-subtle);
    }
    .staff-table th {
      font-size: 0.8rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .staff-table tr:hover td {
      background: rgba(124, 58, 237, 0.05);
    }
    @media (max-width: 768px) {
      .staff-table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient Aizen Spiritual Particles Canvas -->
  <canvas id="aizen-particles-canvas"></canvas>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-brand">
        <img src="/assets/logo.svg" alt="KYOKA Logo" class="nav-logo" />
        <span>KYOKA <span style="color: var(--purple-light);">3.0</span></span>
      </a>

      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">
        ☰
      </button>

      <ul id="nav-links" class="nav-links">
        <li><a href="/" class="nav-link">Home</a></li>
        <li><a href="/features" class="nav-link">Features</a></li>
        <li><a href="/commands" class="nav-link">Commands</a></li>
        <li><a href="/premium" class="nav-link">Premium</a></li>
        <li><a href="/shop" class="nav-link">Shop</a></li>
        <li><a href="/dashboard" class="nav-link">Dashboard</a></li>
        <li><a href="/tickets" class="nav-link">Tickets</a></li>
        <li><a href="/staff" class="nav-link active">Staff</a></li>
        <li><a href="/support" class="nav-link">Support</a></li>
      </ul>

      <div class="nav-actions">
        <div id="auth-nav-slot">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Staff Operations Wrapper -->
  <main class="staff-container">
    <div id="staff-app-container">
      <div style="text-align: center; padding: 4rem 1.5rem; color: var(--text-muted);">
        <div class="server-icon-placeholder" style="width: 48px; height: 48px; margin: 0 auto 1rem; animation: loading 1.5s infinite;">🛡️</div>
        <p>Verifying staff credentials...</p>
      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-bottom" style="border-top: none; padding-top: 0;">
      <span>&copy; 2026 KYOKA 3.0 Project. Staff Command & Operations Center.</span>
      <div class="creator-signature-badge">
        <span class="creator-pulse-gem"></span>
        <span>Website made by — <strong class="creator-name">Aizen</strong> <span class="creator-tag">(ruthupavan)</span></span>
      </div>
      <span style="color: var(--purple-light);">Authorized Personnel Only</span>
    </div>
  </footer>

  <script type="module" src="/js/particles.js?v=3.6.0"></script>
  <script type="module" src="/js/audio.js?v=3.6.0"></script>
  <script type="module" src="/js/app.js?v=3.6.0"></script>
  <script type="module" src="/js/staff.js?v=3.6.0"></script>
</body>
</html>
