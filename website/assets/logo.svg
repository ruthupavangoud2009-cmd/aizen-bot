<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="kyokaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>
    <filter id="kyokaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Shield Crest -->
  <polygon points="50,6 90,24 90,62 50,94 10,62 10,24" fill="#130924" stroke="url(#kyokaGrad)" stroke-width="3" filter="url(#kyokaGlow)" />
  <!-- Inner Kanji / K Emblem Motif -->
  <path d="M36,26 L36,74 M66,28 L40,50 L68,72" stroke="#E9D5FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Aizen Core Jewel -->
  <circle cx="50" cy="50" r="4.5" fill="#C084FC" filter="url(#kyokaGlow)" />
</svg>
