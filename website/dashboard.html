<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KYOKA 3.0 — Discord Server Dashboard</title>
  <meta name="description" content="Secure web dashboard for KYOKA 3.0. Select your Discord servers, manage anti-nuke defense, member verification gates, AI personas, and high-fidelity music settings." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <!-- Ambient Aizen Spiritual Particles Canvas -->
  <canvas id="aizen-particles-canvas"></canvas>

  <!-- Aizen Ambient Audio Dock (Mounted by audio.js) -->
  <div class="aizen-audio-dock" id="aizen-audio-dock"></div>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-brand">
        <img src="/assets/logo.svg" alt="KYOKA Logo" class="nav-logo" />
        <span>KYOKA <span style="color: var(--purple-light);">3.0</span></span>
      </a>

      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">
        ☰
      </button>

      <ul id="nav-links" class="nav-links">
        <li><a href="/" class="nav-link">Home</a></li>
        <li><a href="/features.html" class="nav-link">Features</a></li>
        <li><a href="/commands.html" class="nav-link">Commands</a></li>
        <li><a href="/premium.html" class="nav-link">Premium</a></li>
        <li><a href="/changelog.html" class="nav-link">Changelog</a></li>
        <li><a href="/support.html" class="nav-link">Support</a></li>
        <li><a href="/dashboard.html" class="nav-link active">Dashboard</a></li>
      </ul>

      <div class="nav-actions">
        <div id="auth-nav-slot">
          <!-- Populated dynamically: Profile pill + logout or Login button -->
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Dashboard App Container -->
  <main class="dashboard-wrapper">
    <div id="dashboard-app">
      <!-- State 1: Logged Out Hero Card OR State 2: Server Selector OR State 3: Server Workspace -->
      <div style="text-align: center; padding: 5rem 1.5rem;">
        <div class="server-icon-placeholder" style="width: 56px; height: 56px; margin: 0 auto 1.5rem; animation: loading 1.5s infinite;">⚡</div>
        <h3 style="color: var(--purple-white); font-weight: 700; margin-bottom: 0.5rem;">Loading KYOKA 3.0 Dashboard...</h3>
        <p style="color: var(--text-dim); font-size: 0.9rem;">Connecting to authentication services...</p>
      </div>
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-bottom" style="border-top: none; padding-top: 0;">
      <span>&copy; 2026 KYOKA 3.0 Project. Secure Discord Server Dashboard.</span>
      <span style="color: var(--purple-light);">Protected by Discord OAuth2 & Server-Side Permission Gates</span>
    </div>
  </footer>

  <script type="module" src="/js/particles.js"></script>
  <script type="module" src="/js/audio.js"></script>
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
