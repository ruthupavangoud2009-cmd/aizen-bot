services:
  - type: web
    name: kyoka-discord-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: virginia
    healthCheckPath: /health
    autoDeploy: true
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: python -m src.main
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_PROXY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: BOT_PREFIX
        value: "+"
      - key: SYNC_COMMANDS_ON_STARTUP
        value: "false"
      # Public Lavalink V4 Cluster Settings (Ultra-lean ~70MB container)
      - key: LAVALINK_AUTO_DISCOVER
        value: "false"
      - key: LAVALINK_SECURE
        value: "true"
      - key: LAVALINK_IDENTIFIER
        value: "kyoka-lavalink-v4"
      - key: LAVALINK_PASSWORD
        value: "https://seretia.link/discord"
      - key: LAVALINK_URI
        value: "https://lavalinkv4.serenetia.com:443"
      - key: LAVALINK_FALLBACK_URIS
        value: "http://lava-v4.ajieblogs.eu.org:80|https://dsc.gg/ajidevserver,https://lavalink.nazha.online:443|nazhafreelava"
      # Spotify Resolution Credentials
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # High-Performance Music Cache Configuration
      - key: MUSIC_CACHE_MAX_MB
        value: "128"
      - key: MUSIC_CACHE_TTL_DAYS
        value: "7"
      # AI and Bot Runtime Settings
      - key: GEMINI_MODEL
        value: "gemini-flash-lite-latest"
      - key: AI_RESPONSE_TIMEOUT_SECONDS
        value: "15"
      - key: AI_USER_COOLDOWN_SECONDS
        value: "3"
      - key: AI_CHANNEL_COOLDOWN_SECONDS
        value: "2"
      - key: AI_MAX_CONCURRENT_REQUESTS
        value: "5"
      - key: DISCORD_CLIENT_ID
        value: "1562505487214321714"
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        value: "https://aizen-bot.pages.dev/api/auth/callback"
      - key: FRONTEND_ORIGIN
        value: "https://aizen-bot.pages.dev"
      - key: DASHBOARD_SECRET_KEY
        generateValue: true
