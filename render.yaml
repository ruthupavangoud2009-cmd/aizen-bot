services:
  - type: web
    name: kyoka-discord-bot
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: python src/main.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: BOT_PREFIX
        value: "?"
      - key: LAVALINK_AUTO_DISCOVER
        value: "1"
      - key: LAVALINK_PUBLIC_LIST_URL
        value: "https://lavalink-list.ajieblogs.eu.org/All"
      - key: LAVALINK_URI
        value: "http://lava2.kasawa.pro:2334"
      - key: LAVALINK_PASSWORD
        value: "youshallnotpass"
      - key: GEMINI_MODEL
        value: "gemini-3.8-flash"
