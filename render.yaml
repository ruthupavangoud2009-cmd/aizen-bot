services:
  - type: web
    name: kyoka-discord-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: virginia
    healthCheckPath: /health
    autoDeploy: true
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: python scripts/run_combined.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_PROXY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: BOT_PREFIX
        value: "+"
      - key: SYNC_COMMANDS_ON_STARTUP
        value: "false"
      # Co-located Private Lavalink V4 Engine Settings (localhost 127.0.0.1:2333)
      - key: LAVALINK_AUTO_DISCOVER
        value: "0"
      - key: LAVALINK_HOST
        value: "127.0.0.1"
      - key: LAVALINK_PORT
        value: "2333"
      - key: LAVALINK_SECURE
        value: "false"
      - key: LAVALINK_IDENTIFIER
        value: "kyoka-lavalink-local"
      - key: LAVALINK_PASSWORD
        sync: false
      - key: LAVALINK_URI
        value: "http://127.0.0.1:2333"
      - key: LAVALINK_READINESS_TIMEOUT
        value: "300"
      # JVM Tuning for 500MB / 512MB Container Hosting (Strict 180MB heap limit to prevent OOM)
      - key: JAVA_OPTS
        value: "-Xmx180m -Xms48m -XX:+UseSerialGC -XX:MaxMetaspaceSize=80m -XX:ReservedCodeCacheSize=24m -XX:MaxDirectMemorySize=24m -Xss256k -Dio.netty.allocator.type=unpooled -Dfile.encoding=UTF-8 -Djava.security.egd=file:/dev/./urandom"
      - key: CONTAINER_MAX_RAM_MB
        value: "500"
      # Spotify Resolution Credentials (optional, from kyoka-lavalink)
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # High-Performance Music Cache Configuration (Capped for 500MB container)
      - key: MUSIC_CACHE_MAX_MB
        value: "128"
      - key: MUSIC_CACHE_TTL_DAYS
        value: "7"
      # AI and Bot Runtime Settings
      - key: GEMINI_MODEL
        value: "gemini-flash-lite-latest"
      - key: AI_RESPONSE_TIMEOUT_SECONDS
        value: "15"
      - key: AI_USER_COOLDOWN_SECONDS
        value: "3"
      - key: AI_CHANNEL_COOLDOWN_SECONDS
        value: "2"
      - key: AI_MAX_CONCURRENT_REQUESTS
        value: "5"
      - key: DISCORD_CLIENT_ID
        value: "1562505487214321714"
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        value: "https://aizen-bot.pages.dev/api/auth/callback"
      - key: FRONTEND_ORIGIN
        value: "https://aizen-bot.pages.dev"
      - key: DASHBOARD_SECRET_KEY
        generateValue: true
