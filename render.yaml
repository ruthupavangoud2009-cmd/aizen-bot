services:
  - type: web
    name: kyoka-discord-bot
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: python src/main.py
    plan: free
    region: ohio
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: BOT_PREFIX
        value: "+"
      - key: SYNC_COMMANDS_ON_STARTUP
        value: "false"
      - key: LAVALINK_AUTO_DISCOVER
        value: "1"
      - key: LAVALINK_PUBLIC_LIST_URL
        value: "https://lavalink-list.ajieblogs.eu.org/All"
      - key: LAVALINK_URI
        value: "http://lava2.kasawa.pro:2334"
      - key: LAVALINK_PASSWORD
        value: "youshallnotpass"
      - key: GEMINI_MODEL
        value: "gemini-flash-lite-latest"
      - key: AI_RESPONSE_TIMEOUT_SECONDS
        value: "15"
      - key: AI_USER_COOLDOWN_SECONDS
        value: "3"
      - key: AI_CHANNEL_COOLDOWN_SECONDS
        value: "2"
      - key: AI_MAX_CONCURRENT_REQUESTS
        value: "5"
